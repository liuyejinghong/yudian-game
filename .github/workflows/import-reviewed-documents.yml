name: Import reviewed documents (one time)

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-reviewed-documents.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'liuyejinghong/yudian-game' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify original product versions
        run: python3 tools/reconstruct_reviewed_docs.py
      - name: Finalize original source archive and manifest
        run: python3 tools/finalize_document_import.py
      - name: Check all current links and acceptance numbering
        run: python3 tools/verify_documents.py
      - name: Run documentation validator tests
        run: python3 -m unittest discover -s tools -p 'test_verify_documents.py' -v
      - name: Record documentation evidence
        run: |
          mkdir -p docs/engineering
          python3 - <<'PY'
          import os
          from pathlib import Path
          report = f'''# 文档导入与检查记录

          日期：2026-10-03。执行环境：GitHub Actions Ubuntu；只处理文档，不运行游戏。

          - 原始产品 v0.1／v0.2／v0.3：与交付附件的字节数和 SHA-256 一致。
          - 原始美术 v0.1／v0.2 与旧外部审查提示词：与交付附件的字节数和 SHA-256 一致。
          - 当前产品主文档：完整保留 v0.3 正文，不是摘要；最新 v0.4 补充由 README 和决定登记明确优先。
          - 当前内部 Markdown 文件链接、必要文档、历史六份源文件校验：通过。
          - 原有 A01–A24、新增 B01–B08 编号：完整，共 32 个需求场景，不是已跑游戏测试。
          - 文档验证工具自测试：7 项通过。

          工作流：[run {os.environ['GITHUB_RUN_ID']}](https://github.com/liuyejinghong/yudian-game/actions/runs/{os.environ['GITHUB_RUN_ID']})。
          输入提交：`{os.environ['GITHUB_SHA']}`。实际写回提交由本报告所在 Git 历史确定。

          复查命令：`python3 tools/verify_documents.py` 与 `python3 -m unittest discover -s tools -p 'test_verify_documents.py'`。

          Godot／.NET 原生构建、机器人模拟、真实模型、地形导航、MetalFX 等接入、低配性能和真人试玩：**NOT_RUN**。
          未修改旧 MUD 仓库、部署或数据库；未更改新库可见性，未添加开源许可证。一次性导入工作流完成后移除，保留脚本与哈希供审计，不作为未来游戏 CI。
          '''
          Path('docs/engineering/import-verification.md').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in report.splitlines()) + '\n', encoding='utf-8')
          PY
          python3 tools/verify_documents.py
      - name: Commit only verified documentation outputs
        run: |
          git add -- archive/conversation/yudian-3d-product-definition-v0.2.md archive/conversation/yudian-3d-product-definition-v0.3.md docs/product/product-definition.md tools/reviewed-document-patches.json archive/conversation/07-external-review-prompt.md archive/conversation/yudian-art-direction-v0.2.md archive/source-manifest.json docs/engineering/import-verification.md
          if git diff --cached --quiet; then
            echo 'All reviewed documents already match; no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: verify complete reviewed sources, links and 32 acceptance scenarios'
          git push origin HEAD:main
